<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/homey.js" data-origin="settings"></script>
  </head>
  <body>
    <h1 data-i18n="settings.title"></h1>
    <p data-i18n="settings.subtitle"></p>

    <fieldset>
      <legend data-i18n="settings.connection.title"></legend>
      <div class="field row">
        <label
          for="central-id"
          data-i18n="settings.connection.central_id"
        ></label>
        <input id="central-id" type="text" autocomplete="off" />
      </div>
      <div class="field row">
        <label for="host" data-i18n="settings.connection.host"></label>
        <input id="host" type="text" inputmode="url" autocomplete="off" />
      </div>
      <div class="field row">
        <label
          for="hmip-port"
          data-i18n="settings.connection.hmip_port"
        ></label>
        <input id="hmip-port" type="number" min="1" max="65535" value="2010" />
      </div>
      <div class="field row">
        <label
          for="callback-port"
          data-i18n="settings.connection.callback_port"
        ></label>
        <input
          id="callback-port"
          type="number"
          min="1"
          max="65535"
          value="12010"
        />
      </div>
      <div class="field row">
        <label for="username" data-i18n="settings.connection.username"></label>
        <input id="username" type="text" autocomplete="username" />
      </div>
      <div class="field row">
        <label for="password" data-i18n="settings.connection.password"></label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <p data-i18n="settings.connection.hint"></p>
    </fieldset>

    <button id="save" class="right" data-i18n="settings.save"></button>

    <fieldset>
      <legend data-i18n="settings.diagnostics.title"></legend>
      <p data-i18n="settings.diagnostics.hint"></p>
      <button
        id="download-diagnostics"
        data-i18n="settings.diagnostics.download"
      ></button>
    </fieldset>

    <script>
      "use strict";

      const SETTINGS_KEY = "openccu_connections";
      const fields = {
        centralId: document.getElementById("central-id"),
        host: document.getElementById("host"),
        hmIpRfPort: document.getElementById("hmip-port"),
        callbackPort: document.getElementById("callback-port"),
        username: document.getElementById("username"),
        password: document.getElementById("password"),
      };

      function onHomeyReady(Homey) {
        Homey.get(SETTINGS_KEY, (error, connections) => {
          if (error) return Homey.alert(error);
          const connection = Array.isArray(connections)
            ? connections[0]
            : undefined;
          if (connection) {
            fields.centralId.value = connection.centralId || "";
            fields.host.value = connection.host || "";
            fields.hmIpRfPort.value = connection.hmIpRfPort || 2010;
            fields.callbackPort.value = connection.callbackPort || 12010;
            fields.username.value = connection.username || "";
            fields.password.value = connection.password || "";
          }
          Homey.ready();
        });

        document.getElementById("save").addEventListener("click", () => {
          const connection = readConnection();
          const error = validateConnection(connection);
          if (error) return Homey.alert(error);
          Homey.set(SETTINGS_KEY, [connection], (saveError) => {
            if (saveError) return Homey.alert(saveError);
            Homey.alert(Homey.__("settings.saved"));
          });
        });

        document
          .getElementById("download-diagnostics")
          .addEventListener("click", () => {
            Homey.api("GET", "/diagnostics", (error, report) => {
              if (error) return Homey.alert(error);
              downloadJson("openccu-for-homey-diagnostics.json", report);
            });
          });
      }

      function downloadJson(filename, value) {
        const blob = new Blob([JSON.stringify(value, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function readConnection() {
        const username = fields.username.value.trim();
        const password = fields.password.value;
        return {
          centralId: fields.centralId.value.trim(),
          host: fields.host.value.trim(),
          hmIpRfPort: Number(fields.hmIpRfPort.value),
          callbackPort: Number(fields.callbackPort.value),
          ...(username === "" && password === "" ? {} : { username, password }),
        };
      }

      function validateConnection(connection) {
        if (!connection.centralId) return "Central ID is required";
        if (!connection.host) return "OpenCCU host is required";
        if (
          connection.host.includes("://") ||
          /[/?#\s]/u.test(connection.host)
        ) {
          return "Enter a host name or IP address without protocol or path";
        }
        if (
          !Number.isInteger(connection.hmIpRfPort) ||
          connection.hmIpRfPort < 1 ||
          connection.hmIpRfPort > 65535
        ) {
          return "HmIP-RF port must be an integer between 1 and 65535";
        }
        if (
          !Number.isInteger(connection.callbackPort) ||
          connection.callbackPort < 1 ||
          connection.callbackPort > 65535
        ) {
          return "Callback port must be an integer between 1 and 65535";
        }
        if (
          (connection.username === undefined) !==
          (connection.password === undefined)
        ) {
          return "Username and password must both be set or both be empty";
        }
        if (connection.username === "" || connection.password === "") {
          return "Username and password must both be set or both be empty";
        }
        return undefined;
      }
    </script>
  </body>
</html>
