<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/homey.js" data-origin="settings"></script>
    <link rel="stylesheet" href="../assets/heating-editor.css" />
    <script src="../assets/heating-editor.js"></script>
  </head>
  <body>
    <h1 data-i18n="settings.title"></h1>
    <p data-i18n="settings.subtitle"></p>

    <fieldset>
      <legend data-i18n="settings.connection.title"></legend>
      <div class="field row">
        <label
          for="central-id"
          data-i18n="settings.connection.central_id"
        ></label>
        <input id="central-id" type="text" autocomplete="off" />
      </div>
      <div class="field row">
        <label for="host" data-i18n="settings.connection.host"></label>
        <input id="host" type="text" inputmode="url" autocomplete="off" />
      </div>
      <div class="field row">
        <label
          for="hmip-port"
          data-i18n="settings.connection.hmip_port"
        ></label>
        <input id="hmip-port" type="number" min="1" max="65535" value="2010" />
      </div>
      <div class="field row">
        <label
          for="virtual-devices-port"
          data-i18n="settings.connection.virtual_devices_port"
        ></label>
        <input
          id="virtual-devices-port"
          type="number"
          min="1"
          max="65535"
          value="9292"
        />
      </div>
      <div class="field row">
        <label
          for="callback-port"
          data-i18n="settings.connection.callback_port"
        ></label>
        <input
          id="callback-port"
          type="number"
          min="1"
          max="65535"
          value="12010"
        />
      </div>
      <div class="field row">
        <label
          for="virtual-devices-callback-port"
          data-i18n="settings.connection.virtual_devices_callback_port"
        ></label>
        <input
          id="virtual-devices-callback-port"
          type="number"
          min="1"
          max="65535"
          value="12011"
        />
      </div>
      <div class="field row">
        <label
          for="bidcos-enabled"
          data-i18n="settings.connection.bidcos_enabled"
        ></label>
        <input id="bidcos-enabled" type="checkbox" />
      </div>
      <div class="field row">
        <label
          for="bidcos-port"
          data-i18n="settings.connection.bidcos_port"
        ></label>
        <input
          id="bidcos-port"
          type="number"
          min="1"
          max="65535"
          value="2001"
        />
      </div>
      <div class="field row">
        <label
          for="bidcos-callback-port"
          data-i18n="settings.connection.bidcos_callback_port"
        ></label>
        <input
          id="bidcos-callback-port"
          type="number"
          min="1"
          max="65535"
          value="12012"
        />
      </div>
      <div class="field row">
        <label for="username" data-i18n="settings.connection.username"></label>
        <input id="username" type="text" autocomplete="username" />
      </div>
      <div class="field row">
        <label for="password" data-i18n="settings.connection.password"></label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <p data-i18n="settings.connection.hint"></p>
      <button
        id="discover"
        type="button"
        data-i18n="settings.discovery.button"
      ></button>
      <div id="discovery-results" hidden>
        <label
          for="discovered-ccu"
          data-i18n="settings.discovery.results"
        ></label>
        <select id="discovered-ccu"></select>
      </div>
    </fieldset>

    <button id="save" class="right" data-i18n="settings.save"></button>

    <fieldset>
      <legend data-i18n="settings.diagnostics.title"></legend>
      <p data-i18n="settings.diagnostics.hint"></p>
      <button
        id="download-diagnostics"
        type="button"
        data-i18n="settings.diagnostics.download"
      ></button>
      <div id="diagnostics-export" hidden>
        <p id="diagnostics-status" aria-live="polite"></p>
        <div class="field row">
          <label
            for="diagnostics-model"
            data-i18n="settings.diagnostics.model"
          ></label>
          <select id="diagnostics-model"></select>
        </div>
        <label
          id="diagnostics-content-label"
          for="diagnostics-content"
          data-i18n="settings.diagnostics.content"
        ></label>
        <textarea
          id="diagnostics-content"
          rows="10"
          readonly
          spellcheck="false"
          aria-labelledby="diagnostics-content-label"
          style="box-sizing: border-box; width: 100%; resize: vertical"
        ></textarea>
        <button
          id="save-diagnostics"
          type="button"
          data-i18n="settings.diagnostics.save"
        ></button>
        <button
          id="copy-diagnostics"
          type="button"
          data-i18n="settings.diagnostics.copy"
        ></button>
        <p data-i18n="settings.diagnostics.attach_hint"></p>
        <a
          href="https://github.com/branselbytes/homey-openccu/issues/new/choose"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="settings.diagnostics.open_issue"
        ></a>
      </div>
    </fieldset>

    <section id="heating-profiles"></section>

    <script>
      "use strict";

      const SETTINGS_KEY = "openccu_connections";
      const DIAGNOSTICS_SUMMARY_LIMIT = 12000;
      let diagnosticsReport;
      const fields = {
        centralId: document.getElementById("central-id"),
        host: document.getElementById("host"),
        hmIpRfPort: document.getElementById("hmip-port"),
        virtualDevicesPort: document.getElementById("virtual-devices-port"),
        callbackPort: document.getElementById("callback-port"),
        virtualDevicesCallbackPort: document.getElementById(
          "virtual-devices-callback-port",
        ),
        enableBidCosRf: document.getElementById("bidcos-enabled"),
        bidCosRfPort: document.getElementById("bidcos-port"),
        bidCosRfCallbackPort: document.getElementById("bidcos-callback-port"),
        username: document.getElementById("username"),
        password: document.getElementById("password"),
      };

      function onHomeyReady(Homey) {
        if (window.OpenCcuHeatingEditor) {
          const heatingApi = (method, path, body) =>
            new Promise((resolve, reject) => {
              const callback = (error, value) =>
                error ? reject(error) : resolve(value);
              if (body === undefined) Homey.api(method, path, callback);
              else Homey.api(method, path, body, callback);
            });
          window.openCcuHeatingEditor = window.OpenCcuHeatingEditor.mount(
            document.getElementById("heating-profiles"),
            {
              homey: Homey,
              listTargets: () => heatingApi("GET", "/heating/targets"),
              read: (targetId) =>
                heatingApi("POST", "/heating/read", { targetId }),
              save: (targetId, request) =>
                heatingApi("POST", "/heating/save", { targetId, ...request }),
            },
          );
        }

        Homey.get(SETTINGS_KEY, (error, connections) => {
          if (error) return Homey.alert(error);
          const connection = Array.isArray(connections)
            ? connections[0]
            : undefined;
          if (connection) {
            fields.centralId.value = connection.centralId || "";
            fields.host.value = connection.host || "";
            fields.hmIpRfPort.value = connection.hmIpRfPort || 2010;
            fields.virtualDevicesPort.value =
              connection.virtualDevicesPort || 9292;
            fields.callbackPort.value = connection.callbackPort || 12010;
            fields.virtualDevicesCallbackPort.value =
              connection.virtualDevicesCallbackPort || 12011;
            fields.enableBidCosRf.checked = connection.enableBidCosRf === true;
            fields.bidCosRfPort.value = connection.bidCosRfPort || 2001;
            fields.bidCosRfCallbackPort.value =
              connection.bidCosRfCallbackPort ||
              Number(fields.callbackPort.value) + 2;
            fields.username.value = connection.username || "";
            fields.password.value = connection.password || "";
          }
          Homey.ready();
        });

        document.getElementById("save").addEventListener("click", () => {
          const connection = readConnection();
          const error = validateConnection(connection);
          if (error) return Homey.alert(error);
          Homey.set(SETTINGS_KEY, [connection], (saveError) => {
            if (saveError) return Homey.alert(saveError);
            Homey.alert(Homey.__("settings.saved"));
          });
        });

        document.getElementById("discover").addEventListener("click", () => {
          const button = document.getElementById("discover");
          button.disabled = true;
          Homey.api("GET", "/discovery", (error, results) => {
            button.disabled = false;
            if (error) return Homey.alert(error);
            if (!Array.isArray(results) || results.length === 0) {
              return Homey.alert(Homey.__("settings.discovery.none"));
            }
            showDiscoveryResults(results);
          });
        });

        document
          .getElementById("discovered-ccu")
          .addEventListener("change", applyDiscoveredOpenCcu);

        document
          .getElementById("download-diagnostics")
          .addEventListener("click", () => {
            const button = document.getElementById("download-diagnostics");
            button.disabled = true;
            Homey.api("GET", "/diagnostics", (error, report) => {
              button.disabled = false;
              if (error) return Homey.alert(error);
              diagnosticsReport = report;
              populateDiagnosticModels(report);
              renderDiagnosticsSummary();
              document.getElementById("diagnostics-export").hidden = false;
            });
          });

        document
          .getElementById("diagnostics-model")
          .addEventListener("change", renderDiagnosticsSummary);

        document
          .getElementById("save-diagnostics")
          .addEventListener("click", async () => {
            try {
              const result = await saveDiagnosticsFile(
                "openccu-for-homey-diagnostics.json",
                JSON.stringify(diagnosticsReport, null, 2),
              );
              setDiagnosticsStatus(
                result === "shared"
                  ? "settings.diagnostics.shared"
                  : "settings.diagnostics.saved",
              );
            } catch (error) {
              if (error && error.name === "AbortError") return;
              setDiagnosticsStatus("settings.diagnostics.save_failed");
            }
          });

        document
          .getElementById("copy-diagnostics")
          .addEventListener("click", async () => {
            const content = document.getElementById("diagnostics-content");
            try {
              await copyText(content);
              setDiagnosticsStatus("settings.diagnostics.copied");
            } catch {
              setDiagnosticsStatus("settings.diagnostics.copy_failed");
            }
          });
      }

      function showDiscoveryResults(results) {
        const select = document.getElementById("discovered-ccu");
        select.replaceChildren();
        for (const result of results) {
          if (
            !result ||
            typeof result.address !== "string" ||
            typeof result.serial !== "string" ||
            typeof result.type !== "string"
          )
            continue;
          const option = document.createElement("option");
          option.value = JSON.stringify(result);
          option.textContent = `${result.type} · ${result.address} (${result.serial})`;
          select.appendChild(option);
        }
        if (select.options.length === 0) return;
        document.getElementById("discovery-results").hidden = false;
        select.selectedIndex = 0;
        applyDiscoveredOpenCcu();
      }

      function applyDiscoveredOpenCcu() {
        const value = document.getElementById("discovered-ccu").value;
        if (!value) return;
        const result = JSON.parse(value);
        fields.host.value = result.address;
        if (!fields.centralId.value.trim())
          fields.centralId.value = result.serial;
      }

      function diagnosticInterfaces(report) {
        return report.centrals.flatMap((central, index) => [
          { runtime: central.runtime, label: `Central ${index + 1}` },
          ...(central.interfaces || []).map(({ interfaceId, runtime }) => ({
            runtime,
            label: `Central ${index + 1} / ${interfaceId}`,
          })),
        ]);
      }

      function populateDiagnosticModels(report) {
        const select = document.getElementById("diagnostics-model");
        select.replaceChildren();
        const all = document.createElement("option");
        all.value = "";
        all.textContent = Homey.__("settings.diagnostics.all_models");
        select.appendChild(all);
        const models = new Set(
          diagnosticInterfaces(report).flatMap(({ runtime }) =>
            runtime.devices.map(({ type }) => type),
          ),
        );
        for (const model of [...models].sort()) {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          select.appendChild(option);
        }
        select.value = "";
      }

      function renderDiagnosticsSummary() {
        if (!diagnosticsReport) return;
        document.getElementById("diagnostics-content").value =
          summarizeDiagnostics(
            diagnosticsReport,
            document.getElementById("diagnostics-model").value,
          );
        setDiagnosticsStatus("settings.diagnostics.ready");
      }

      function summarizeDiagnostics(report, model = "") {
        const truncatedNotice =
          "Summary shortened. Attach the full JSON file to a GitHub issue for complete details.";
        const lines = [];
        let length = 0;
        let truncated = false;
        const add = (line) => {
          if (truncated) return;
          if (
            length + line.length + 1 >
            DIAGNOSTICS_SUMMARY_LIMIT - truncatedNotice.length - 1
          ) {
            truncated = true;
            return;
          }
          lines.push(line);
          length += line.length + 1;
        };
        add("OpenCCU Local support summary (no current datapoint values)");
        add(
          `App: ${report.app.id} ${report.app.version}; Node: ${report.app.node}`,
        );
        add(
          `Generated: ${report.generatedAt}; schema: ${report.schemaVersion}`,
        );
        add(
          `Model: ${model || "all (select a model for datapoint definitions)"}`,
        );
        diagnosticInterfaces(report).forEach(({ runtime, label }) => {
          add("");
          add(
            `${label}: ${runtime.connectionState}; devices=${runtime.deviceCount}; ` +
              `issues discovery=${runtime.discoveryIssueCount}, metadata=${runtime.metadataIssueCount}, system=${runtime.systemInformationIssueCount}`,
          );
          if (runtime.transport) {
            const t = runtime.transport;
            add(
              `XML-RPC: total=${t.totalRequests}, failed=${t.failedRequests}, timedOut=${t.timedOutRequests}, active=${t.activeRequests}, queued=${t.queuedRequests}`,
            );
            const error = t.lastError;
            if (
              error &&
              [
                "listDevices",
                "getParamsetDescription",
                "getValue",
                "getParamset",
                "setValue",
                "putParamset",
                "init",
              ].includes(error.method) &&
              [
                "aborted",
                "authentication",
                "invalid-response",
                "not-connected",
                "remote-fault",
                "timeout",
                "transport",
              ].includes(error.code)
            ) {
              add(
                `Last XML-RPC error: method=${error.method}; code=${error.code}` +
                  (Number.isInteger(error.faultCode) &&
                  error.faultCode >= -2147483648 &&
                  error.faultCode <= 2147483647
                    ? `; faultCode=${error.faultCode}`
                    : ""),
              );
            }
          }
          const groups = new Map();
          for (const device of runtime.devices) {
            if (model && device.type !== model) continue;
            const group = groups.get(device.type) || [];
            group.push(device);
            groups.set(device.type, group);
          }
          for (const [type, devices] of groups) {
            const firmware = [
              ...new Set(devices.map((d) => d.firmware || "unknown")),
            ];
            const mappings = [
              ...new Set(
                devices.flatMap((d) =>
                  d.mappings.map(
                    (m) =>
                      `${m.driverId}${m.generic ? " (generic)" : ""}: ${m.capabilities.join(", ") || "no capabilities"}`,
                  ),
                ),
              ),
            ];
            add(
              `${type}: ${devices.length} device(s); firmware=${firmware.join(", ")}`,
            );
            add(`  Mappings: ${mappings.join("; ") || "none"}`);
            if (!model) continue;
            // Preserve different firmware/channel schemas without repeating
            // identical definitions for every physical device of one model.
            const schemas = new Set();
            for (const device of devices) {
              for (const channel of device.channels) {
                const schema = JSON.stringify(channel);
                if (schemas.has(schema)) continue;
                schemas.add(schema);
                add(`  Channel ${channel.index ?? "?"}: ${channel.type}`);
                for (const point of channel.dataPoints) {
                  add(
                    `    ${point.parameter}: ${point.type}; operations=${point.operations}` +
                      (point.valueList
                        ? `; enum=${point.valueList.join(",")}`
                        : "") +
                      (point.min === undefined ? "" : `; min=${point.min}`) +
                      (point.max === undefined ? "" : `; max=${point.max}`) +
                      (point.unit ? `; unit=${point.unit}` : ""),
                  );
                }
              }
            }
          }
        });
        if (truncated) lines.push(truncatedNotice);
        return lines.join("\n");
      }

      async function saveDiagnosticsFile(filename, content) {
        const blob = new Blob([content], {
          type: "application/json",
        });
        if (
          typeof File === "function" &&
          typeof navigator.share === "function"
        ) {
          try {
            const file = new File([blob], filename, { type: blob.type });
            const shareData = { files: [file], title: filename };
            if (
              typeof navigator.canShare !== "function" ||
              navigator.canShare(shareData)
            ) {
              await navigator.share(shareData);
              return "shared";
            }
          } catch (error) {
            if (error && error.name === "AbortError") throw error;
            // Some Homey webviews expose sharing but do not permit files.
          }
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        return "downloaded";
      }

      async function copyText(textarea) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(textarea.value);
            return;
          } catch {
            // Clipboard permission can be denied in embedded settings views.
          }
        }
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        if (!document.execCommand("copy")) throw new Error("Copy failed");
      }

      function setDiagnosticsStatus(key) {
        document.getElementById("diagnostics-status").textContent =
          Homey.__(key);
      }

      function readConnection() {
        const username = fields.username.value.trim();
        const password = fields.password.value;
        return {
          centralId: fields.centralId.value.trim(),
          host: fields.host.value.trim(),
          enableBidCosRf: fields.enableBidCosRf.checked,
          bidCosRfPort: Number(fields.bidCosRfPort.value),
          bidCosRfCallbackPort: Number(fields.bidCosRfCallbackPort.value),
          hmIpRfPort: Number(fields.hmIpRfPort.value),
          virtualDevicesPort: Number(fields.virtualDevicesPort.value),
          callbackPort: Number(fields.callbackPort.value),
          virtualDevicesCallbackPort: Number(
            fields.virtualDevicesCallbackPort.value,
          ),
          ...(username === "" && password === "" ? {} : { username, password }),
        };
      }

      function validateConnection(connection) {
        if (!connection.centralId)
          return Homey.__("settings.validation.central_id_required");
        if (!connection.host)
          return Homey.__("settings.validation.host_required");
        if (
          connection.host.includes("://") ||
          /[/?#\s]/u.test(connection.host)
        ) {
          return Homey.__("settings.validation.host_invalid");
        }
        if (
          !Number.isInteger(connection.hmIpRfPort) ||
          connection.hmIpRfPort < 1 ||
          connection.hmIpRfPort > 65535
        ) {
          return Homey.__("settings.validation.hmip_port_invalid");
        }
        if (
          !Number.isInteger(connection.virtualDevicesPort) ||
          connection.virtualDevicesPort < 1 ||
          connection.virtualDevicesPort > 65535
        ) {
          return Homey.__("settings.validation.virtual_devices_port_invalid");
        }
        if (
          !Number.isInteger(connection.callbackPort) ||
          connection.callbackPort < 1 ||
          connection.callbackPort > 65535
        ) {
          return Homey.__("settings.validation.callback_port_invalid");
        }
        if (
          !Number.isInteger(connection.virtualDevicesCallbackPort) ||
          connection.virtualDevicesCallbackPort < 1 ||
          connection.virtualDevicesCallbackPort > 65535
        ) {
          return Homey.__(
            "settings.validation.virtual_devices_callback_port_invalid",
          );
        }
        if (
          ![connection.bidCosRfPort, connection.bidCosRfCallbackPort].every(
            (port) => Number.isInteger(port) && port >= 1 && port <= 65535,
          )
        ) {
          return Homey.__("settings.validation.bidcos_port_invalid");
        }
        if (
          connection.enableBidCosRf &&
          [
            connection.callbackPort,
            connection.virtualDevicesCallbackPort,
          ].includes(connection.bidCosRfCallbackPort)
        ) {
          return Homey.__("settings.validation.callback_ports_distinct");
        }
        if (connection.callbackPort === connection.virtualDevicesCallbackPort) {
          return Homey.__("settings.validation.callback_ports_distinct");
        }
        if (
          (connection.username === undefined) !==
          (connection.password === undefined)
        ) {
          return Homey.__("settings.validation.credentials_together");
        }
        if (connection.username === "" || connection.password === "") {
          return Homey.__("settings.validation.credentials_together");
        }
        return undefined;
      }
    </script>
  </body>
</html>
