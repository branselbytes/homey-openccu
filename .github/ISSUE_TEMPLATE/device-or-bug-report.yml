name: Device or bug report
description: Report a Homey/OpenCCU behavior or help verify a device profile
title: "[Device]: "
labels: [device-report]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Never post credentials, serial numbers, IP addresses, raw OpenCCU backups, or unreviewed raw logs. The report generated in the app settings is designed for public issue reports, but you should still review it before upload.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: homey
    attributes:
      label: Homey model and software
      placeholder: Homey Pro (Early 2023), 13.x
    validations:
      required: true
  - type: input
    id: openccu
    attributes:
      label: OpenCCU version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Product type and firmware
      description: Do not enter a serial number or device address.
      placeholder: HmIP-eTRV-B-2, firmware x.y.z
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the approximate time and whether the value arrived later.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics report
      description: Attach the JSON report from the app settings, or paste it here. Review it before submission.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the report and removed any information I do not want to publish.
          required: true
